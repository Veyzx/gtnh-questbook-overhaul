buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "0.1.0"
group = "dev.bqmodern"
archivesBaseName = "BQModernUI-1.7.10"

sourceCompatibility = targetCompatibility = '1.6'

dependencies {
    compile files('libs/BetterQuesting.jar')
}

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

// ForgeGradle 1.2 uses retired HTTP download endpoints; use Mojang's HTTPS version metadata.
tasks.getByName("getVersionJson").url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, "https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json")
tasks.getByName("getAssetsIndex").url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, "https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json")
tasks.getByName("downloadClient").url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar")
tasks.getByName("downloadServer").url = new net.minecraftforge.gradle.delayed.DelayedString(
        project, "https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar")

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
